name: Build and publish add-on image

on:
  push:
    branches: [main]
    paths:
      - "ca350_bridge/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "ca350_bridge/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  ADDON_DIR: ca350_bridge
  IMAGE_NAME: ca350-bridge-{arch}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint config.yaml
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./ca350_bridge"

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v5

      - name: Read add-on version
        id: addon
        run: |
          version="$(grep -E '^version:' "${ADDON_DIR}/config.yaml" | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Building ${ADDON_DIR} version ${version} for ${{ matrix.arch }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes ghcr.io/<owner>/ca350-bridge-<arch>:<version> and :latest.
      # Pull requests build only (--test), nothing is pushed.
      - name: Build add-on image
        uses: home-assistant/builder@2026.06.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/${{ env.ADDON_DIR }} \
            --image ${{ env.IMAGE_NAME }} \
            --docker-hub ghcr.io/${{ steps.addon.outputs.owner }} \
            --addon ${{ github.event_name == 'pull_request' && '--test' || '' }}
