# Stosslüften / Fensterlüften for the ComfoAir 350 — a Home Assistant package.
#
# Press once  -> Stufe 3 for 5 minutes.
# Press again -> +5 minutes on the running countdown (and again, and again).
# Countdown reaches 0 -> the level from before the first press comes back.
# Stop button -> back to the previous level immediately.
#
# Same mechanism, other direction: Fensterlüften sets *absent* while the windows
# are open, so the unit stops pushing tempered air out into an open room. It is
# additive too (+10 minutes per press by default).
#
# The unit's levels map to the climate entity's fan modes like this:
#   off = absent (15 %) · low = Stufe 1 (25 %) · medium = Stufe 2 (40 %) · high = Stufe 3 (70 %)
# The percentages are the add-on's fan_in_* / fan_out_* options.
#
# INSTALL
#   1. Copy this file to /config/ca350_boost.yaml
#   2. In /config/configuration.yaml, under the packages key you already use:
#
#        homeassistant:
#          packages:
#            heat_pump_card: !include heat_pump_card_helpers.yaml
#            ca350_boost: !include ca350_boost.yaml
#
#   3. Developer Tools -> YAML -> Check Configuration, then Restart.
#
# BEFORE RELYING ON IT: change the fan level by hand from the dashboard once and
# check it still holds a minute later. With enable_pc_mode off the CC-Luxe panel
# is the bus master; if it takes the level back, set enable_pc_mode: true in the
# add-on (trade-off documented in ca350_bridge/DOCS.md).

input_number:
  ca350_boost_step:
    name: Stosslüften pro Druck
    icon: mdi:timer-plus-outline
    min: 1
    max: 60
    step: 1
    initial: 5
    unit_of_measurement: min
    mode: box

  ca350_boost_max:
    name: Stosslüften Maximum
    icon: mdi:timer-alert-outline
    min: 5
    max: 240
    step: 5
    initial: 60
    unit_of_measurement: min
    mode: box

  ca350_window_step:
    name: Fensterlüften pro Druck
    icon: mdi:window-open-variant
    min: 1
    max: 60
    step: 1
    initial: 10
    unit_of_measurement: min
    mode: box

input_text:
  # The level to go back to. Empty means "no override in flight". input_text
  # survives a restart, so an override that outlives a Home Assistant restart
  # still restores the right level.
  ca350_level_before_override:
    name: Stufe vor Override
    icon: mdi:backup-restore
    max: 10
    initial: ""

  # The level the override itself is holding. Lets the manual-takeover
  # automation tell "the unit confirmed our own change" from "someone picked a
  # different level".
  ca350_override_target:
    name: Override Zielstufe
    icon: mdi:target
    max: 10
    initial: ""

timer:
  ca350_override:
    name: Lüftung Restzeit
    icon: mdi:fan-clock
    # Keep counting across a restart instead of leaving the unit at Stufe 3.
    restore: true

script:
  # ---------------------------------------------------------------- generic ---
  ca350_override_add:
    alias: ComfoAir Stufe halten und Zeit addieren
    description: >-
      Holds a ventilation level and adds `minutes` to the countdown. First call
      remembers the current level and switches; every further call only extends,
      up to `cap_minutes`. When the countdown ends the remembered level returns.
    # queued, not restart: rapid presses must all add their minutes instead of
    # cancelling each other mid-run.
    mode: queued
    max: 20
    fields:
      fan_mode:
        description: Target fan mode (off | low | medium | high)
        required: true
        example: high
      minutes:
        description: Minutes to add per call
        required: true
        example: 5
      cap_minutes:
        description: Never let the countdown exceed this
        required: false
        example: 60
    variables:
      running: "{{ is_state('timer.ca350_override', 'active') }}"
      remaining_s: >-
        {% if running and state_attr('timer.ca350_override', 'finishes_at') %}
          {{ [ (as_timestamp(state_attr('timer.ca350_override', 'finishes_at')) - as_timestamp(now())) | round(0) | int, 0 ] | max }}
        {% else %}
          0
        {% endif %}
      cap_s: "{{ (cap_minutes | default(240) | int(240)) * 60 }}"
      new_s: "{{ [ remaining_s | int + (minutes | int) * 60, cap_s | int ] | min }}"
    sequence:
      # Remember where to return to — only when nothing is in flight, so the
      # second press does not store 'high' as the level to come back to.
      - if:
          - condition: template
            value_template: "{{ states('input_text.ca350_level_before_override') | trim == '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ca350_level_before_override
            data:
              value: "{{ state_attr('climate.ca350_climate', 'fan_mode') | default('low', true) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_override_target
        data:
          value: "{{ fan_mode }}"
      # Switch the unit only on the first press; later presses just add time.
      - if:
          - condition: template
            value_template: "{{ not running }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: climate.ca350_climate
            data:
              fan_mode: "{{ fan_mode }}"
      - action: timer.start
        target:
          entity_id: timer.ca350_override
        data:
          # timer.start on a running timer restarts it with this duration, which
          # is exactly "remaining + minutes" (capped).
          duration: "{{ '%02d:%02d:%02d' % ((new_s | int) // 3600, ((new_s | int) % 3600) // 60, (new_s | int) % 60) }}"

  # --------------------------------------------------------------- wrappers ---
  ca350_stosslueften:
    alias: Stosslüften (+5 min)
    icon: mdi:weather-windy
    mode: queued
    max: 20
    sequence:
      - action: script.ca350_override_add
        data:
          fan_mode: high
          minutes: "{{ states('input_number.ca350_boost_step') | int(5) }}"
          cap_minutes: "{{ states('input_number.ca350_boost_max') | int(60) }}"

  ca350_fensterlueften:
    alias: Fensterlüften (+10 min)
    icon: mdi:window-open-variant
    mode: queued
    max: 20
    sequence:
      - action: script.ca350_override_add
        data:
          fan_mode: "off"
          minutes: "{{ states('input_number.ca350_window_step') | int(10) }}"
          cap_minutes: "{{ states('input_number.ca350_boost_max') | int(60) }}"

  ca350_override_stop:
    alias: Stosslüften stoppen
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      # Cancelling fires timer.cancelled, which the restore automation picks up —
      # so the previous level comes back right away.
      - action: timer.cancel
        target:
          entity_id: timer.ca350_override

automation:
  # Countdown reached 0, or the stop button cancelled it -> restore the level
  # from before the first press. (A manual takeover clears the memory first, so
  # this then does nothing and the hand-picked level stands.)
  - id: ca350_override_restore
    alias: ComfoAir - Stufe nach Stosslüften zurücksetzen
    triggers:
      - trigger: event
        event_type:
          - timer.finished
          - timer.cancelled
        event_data:
          entity_id: timer.ca350_override
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_text.ca350_level_before_override') in ['off', 'low', 'medium', 'high'] }}
    actions:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.ca350_climate
        data:
          fan_mode: "{{ states('input_text.ca350_level_before_override') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_level_before_override
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_override_target
        data:
          value: ""
    mode: single

  # A level change to something other than what the override is holding means
  # someone picked a level by hand (dashboard, or the CC-Luxe panel) — that wins,
  # so drop the override without restoring.
  - id: ca350_override_manual_takeover
    alias: ComfoAir - Stosslüften bei Handbedienung verwerfen
    triggers:
      - trigger: state
        entity_id: climate.ca350_climate
        attribute: fan_mode
    conditions:
      - condition: state
        entity_id: timer.ca350_override
        state: active
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.fan_mode | string
             != states('input_text.ca350_override_target') }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_level_before_override
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_override_target
        data:
          value: ""
      - action: timer.cancel
        target:
          entity_id: timer.ca350_override
    mode: single
