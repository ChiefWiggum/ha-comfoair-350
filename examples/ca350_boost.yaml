# Stosslüften for the ComfoAir 350 — a Home Assistant package.
#
# Press once  -> Stufe 3 for 5 minutes.
# Press again -> +5 minutes on the running countdown (and again, and again).
# Countdown reaches 0 -> the level from before the first press comes back.
# Stopp -> back to the previous level immediately.
#
# The unit's levels map to the climate entity's fan modes like this:
#   off = absent (15 %) · low = Stufe 1 (25 %) · medium = Stufe 2 (40 %) · high = Stufe 3 (70 %)
# The percentages are the add-on's fan_in_* / fan_out_* options.
#
# INSTALL
#   1. Copy this file to /config/ca350_boost.yaml
#   2. In /config/configuration.yaml, under the packages key you already use:
#
#        homeassistant:
#          packages:
#            heat_pump_card: !include heat_pump_card_helpers.yaml
#            ca350_boost: !include ca350_boost.yaml
#
#   3. Developer Tools -> YAML -> Check Configuration, then Restart.
#
# BEFORE RELYING ON IT: change the fan level by hand from the dashboard once and
# check it still holds a minute later. With enable_pc_mode off the CC-Luxe panel
# is the bus master; if it takes the level back, set enable_pc_mode: true in the
# add-on (trade-off documented in ca350_bridge/DOCS.md).

input_number:
  ca350_boost_step:
    name: Stosslüften pro Druck
    icon: mdi:timer-plus-outline
    min: 1
    max: 60
    step: 1
    initial: 5
    unit_of_measurement: min
    mode: box

  ca350_boost_max:
    name: Stosslüften Maximum
    icon: mdi:timer-alert-outline
    min: 5
    max: 240
    step: 5
    initial: 60
    unit_of_measurement: min
    mode: box

input_text:
  # The level to go back to. Empty means "no Stosslüften in flight". input_text
  # survives a restart, so a countdown that outlives a Home Assistant restart
  # still restores the right level.
  ca350_level_before_boost:
    name: Stufe vor Stosslüften
    icon: mdi:backup-restore
    max: 10
    initial: ""

timer:
  ca350_boost:
    name: Stosslüften Restzeit
    icon: mdi:fan-clock
    # Keep counting across a restart instead of leaving the unit at Stufe 3.
    restore: true

script:
  ca350_stosslueften:
    alias: Stosslüften (+5 min)
    icon: mdi:weather-windy
    description: >-
      First press remembers the current level and switches to Stufe 3; every
      further press adds the step to the running countdown, up to the maximum.
      When the countdown ends the remembered level returns.
    # queued, not restart: rapid presses must all add their minutes instead of
    # cancelling each other mid-run.
    mode: queued
    max: 20
    variables:
      step_s: "{{ (states('input_number.ca350_boost_step') | int(5)) * 60 }}"
      cap_s: "{{ (states('input_number.ca350_boost_max') | int(60)) * 60 }}"
      running: "{{ is_state('timer.ca350_boost', 'active') }}"
      remaining_s: >-
        {% if running and state_attr('timer.ca350_boost', 'finishes_at') %}
          {{ [ (as_timestamp(state_attr('timer.ca350_boost', 'finishes_at')) - as_timestamp(now())) | round(0) | int, 0 ] | max }}
        {% else %}
          0
        {% endif %}
      new_s: "{{ [ (remaining_s | int) + (step_s | int), cap_s | int ] | min }}"
    sequence:
      # Remember where to return to — only when nothing is in flight, so the
      # second press does not store 'high' as the level to come back to.
      - if:
          - condition: template
            value_template: "{{ states('input_text.ca350_level_before_boost') | trim == '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ca350_level_before_boost
            data:
              value: "{{ state_attr('climate.ca350_climate', 'fan_mode') | default('low', true) }}"
      # Switch the unit only on the first press; later presses just add time.
      - if:
          - condition: template
            value_template: "{{ not running }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: climate.ca350_climate
            data:
              fan_mode: high
      - action: timer.start
        target:
          entity_id: timer.ca350_boost
        data:
          # timer.start on a running timer restarts it with this duration, which
          # is exactly "remaining + step" (capped).
          duration: "{{ '%02d:%02d:%02d' % ((new_s | int) // 3600, ((new_s | int) % 3600) // 60, (new_s | int) % 60) }}"

  ca350_stosslueften_stop:
    alias: Stosslüften stoppen
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      # Cancelling fires timer.cancelled, which the restore automation picks up —
      # so the previous level comes back right away.
      - action: timer.cancel
        target:
          entity_id: timer.ca350_boost

automation:
  # Countdown reached 0, or Stopp cancelled it -> restore the level from before
  # the first press. (A manual takeover clears the memory first, so this then
  # does nothing and the hand-picked level stands.)
  - id: ca350_boost_restore
    alias: ComfoAir - Stufe nach Stosslüften zurücksetzen
    triggers:
      - trigger: event
        event_type:
          - timer.finished
          - timer.cancelled
        event_data:
          entity_id: timer.ca350_boost
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_text.ca350_level_before_boost') in ['off', 'low', 'medium', 'high'] }}
    actions:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.ca350_climate
        data:
          fan_mode: "{{ states('input_text.ca350_level_before_boost') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_level_before_boost
        data:
          value: ""
    mode: single

  # A level change to anything other than Stufe 3 while the countdown runs means
  # someone picked a level by hand (dashboard, or the CC-Luxe panel) — that wins,
  # so drop the Stosslüften without restoring.
  - id: ca350_boost_manual_takeover
    alias: ComfoAir - Stosslüften bei Handbedienung verwerfen
    triggers:
      - trigger: state
        entity_id: climate.ca350_climate
        attribute: fan_mode
    conditions:
      - condition: state
        entity_id: timer.ca350_boost
        state: active
      - condition: template
        value_template: "{{ trigger.to_state.attributes.fan_mode | string != 'high' }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.ca350_level_before_boost
        data:
          value: ""
      - action: timer.cancel
        target:
          entity_id: timer.ca350_boost
    mode: single
